name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede in-progress runs on a new push to the same PR/branch; never cancel
# main, so every merged commit is still validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure rustfmt + clippy
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Ensure xmllint
        run: command -v xmllint || (sudo apt-get update && sudo apt-get install -y libxml2-utils)
      - name: Schema validation (XSD)
        # Fails instead of skipping if the schemas in tests/Schema or xmllint are missing
        env:
          ZUGFERD_REQUIRE_XSD: "1"
        run: cargo test --test xsd_validation
